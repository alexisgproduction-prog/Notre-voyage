<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Notre Voyage"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Notre Voyage V2.1</title><style>
:root{--bg:#08080b;--p:#121217;--p2:#19191f;--l:#2a2a33;--t:#f5f5f7;--m:#9999a5;--a:#d9ff5a;--r:#ff6979}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:22px 18px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:5}.ey{color:var(--m);font-size:12px}.title{font-size:30px;font-weight:800;letter-spacing:-1px}.title b{color:var(--a)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.gear{width:42px;height:42px;border-radius:14px;border:1px solid var(--l);background:#19191f;color:#fff;font-size:19px}.status{font-size:12px;color:var(--m);margin-top:7px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#65e3a2;margin-right:6px}.screen{display:none;padding:10px 16px}.screen.on{display:block}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:22px;padding:16px}.hero{padding:22px;background:linear-gradient(145deg,#19191f,#0f0f13);margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:30px}.muted{color:var(--m);font-size:12px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.chip{background:#222229;border:1px solid var(--l);padding:7px 10px;border-radius:99px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card h3{margin:0 0 6px;font-size:13px}.big{font-size:22px;font-weight:750}.accent{color:var(--a)}.red{color:var(--r)}.bar{height:7px;background:#282831;border-radius:9px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.head{display:flex;align-items:center;justify-content:space-between;margin:21px 2px 9px}.head h2{font-size:18px;margin:0}.btn{background:var(--a);color:#080a07;border:0;border-radius:13px;padding:10px 13px;font-weight:750}.btn.sec{background:#25252d;color:var(--t);border:1px solid var(--l)}.btn.sm{padding:8px 10px;font-size:12px}.item{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--l)}.item:last-child{border:0}.ico{width:41px;height:41px;flex:0 0 auto;border-radius:13px;background:#222229;display:grid;place-items:center;font-size:19px}.main{flex:1;min-width:0}.it{font-weight:700}.sub{font-size:12px;color:var(--m);line-height:1.45;margin-top:4px}.amt{text-align:right;font-weight:750;white-space:nowrap}.empty{text-align:center;padding:24px 8px;border:1px dashed var(--l);border-radius:17px;color:var(--m)}.empty b{display:block;color:var(--t);margin-bottom:4px}.nav{position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#15151bf5;backdrop-filter:blur(18px);border:1px solid #33333c;border-radius:23px;padding:7px}.nav button{background:0;color:#888894;border:0;border-radius:16px;padding:6px 2px;font-size:10px}.nav button.on{background:#292930;color:#fff}.nav span{display:block;font-size:18px}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--m)}input,select,textarea{width:100%;background:#17171d;color:var(--t);border:1px solid #33333d;border-radius:13px;padding:12px;outline:0}textarea{min-height:80px}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#101015;border:1px solid var(--l);border-radius:27px 27px 0 0;padding:17px 16px 30px}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{margin:0}.close{border:0;background:#28282f;color:#fff;border-radius:50%;width:34px;height:34px}.banner{background:#18181f;border:1px solid var(--l);border-radius:16px;padding:13px;margin-bottom:11px}.banner strong{display:block;margin-bottom:4px}.balance{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{background:#18181f;border:1px solid var(--l);border-radius:17px;padding:14px}.person strong{display:block;font-size:22px;margin-top:6px}.danger{background:#2b171c;color:#ff9aa4;border:1px solid #4b242b;border-radius:9px;padding:6px 8px}.toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translate(-50%,15px);background:#f5f5f7;color:#111;padding:10px 14px;border-radius:13px;font-size:13px;font-weight:700;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){body{padding:20px}.app{border:1px solid #22222a;border-radius:30px;overflow:hidden}}
</style></head><body><div class="app"><header class="top"><div class="toprow"><div><div class="ey">NOTRE VOYAGE · V2.1</div><div class="title">Alexis <b>×</b> Alix</div></div><button class="gear" onclick="syncSettings()" aria-label="Réglages">⚙️</button></div><div class="status"><i class="dot"></i><span id="status">Mode local · prêt</span></div></header><main><section id="home" class="screen on"></section><section id="trip" class="screen"></section><section id="planning" class="screen"></section><section id="expenses" class="screen"></section><section id="docs" class="screen"></section></main><nav class="nav"><button data-n="home" class="on"><span>⌂</span>Accueil</button><button data-n="trip"><span>✈</span>Voyage</button><button data-n="planning"><span>◷</span>Planning</button><button data-n="expenses"><span>€</span>Dépenses</button><button data-n="docs"><span>▣</span>Docs</button></nav></div><div id="modal" class="modal"><div class="sheet"><div class="sheettop"><h2 id="mt"></h2><button class="close" onclick="closeM()">×</button></div><div id="mb"></div></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const K='nv2',C='nv2cfg';let S=JSON.parse(localStorage.getItem(K)||'null')||{trip:{name:'Cap-Vert',destination:'Cap-Vert 🇨🇻',start:'2026-11-08',end:'2026-11-21',budget:4000,tripId:null,code:null},flights:[],stays:[],plans:[],expenses:[],docs:[]};let cfg=JSON.parse(localStorage.getItem(C)||'null')||{url:'',key:''},db=null,tab='home';const $=id=>document.getElementById(id),E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const EUR=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(+n||0),D=x=>x?new Date(x+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):'—';function save(){localStorage.setItem(K,JSON.stringify(S))}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function go(x){tab=x;render()}function openM(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>go(b.dataset.n));function spent(){return S.expenses.reduce((a,x)=>a+(+x.amount||0),0)}
function render(){home();trip();planning();expenses();docs();document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===tab));document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x.dataset.n===tab))}
function home(){let b=+S.trip.budget||0,s=spent(),p=b?Math.min(100,s/b*100):0;let next=[...S.plans].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);$('home').innerHTML=`<div class="hero"><h1>${E(S.trip.destination)}</h1><div class="muted">${D(S.trip.start)} → ${D(S.trip.end)} · Alexis & Alix</div><div class="chips"><span class="chip">👫 2 personnes</span><span class="chip">💰 ${EUR(b)}</span><span class="chip">${S.trip.code?'🔄 Partagé':'📱 Local'}</span></div></div><div class="grid"><div class="card"><h3>Budget</h3><div class="big">${EUR(b)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="muted" style="margin-top:7px">${EUR(s)} dépensés</div></div><div class="card"><h3>Reste</h3><div class="big ${b-s<0?'red':'accent'}">${EUR(b-s)}</div><div class="muted">sur le budget</div></div></div><div class="head"><h2>À venir</h2><button class="btn sm" onclick="add('plan')">+ Ajouter</button></div><div class="card">${next.length?next.map(x=>`<div class="item"><div class="ico">📍</div><div class="main"><div class="it">${E(x.title)}</div><div class="sub">${D(x.date)} ${E(x.time||'')} · ${E(x.place||'')}</div></div></div>`).join(''):'<div class="empty"><b>Rien de prévu</b>Ajoute une activité ou une étape.</div>'}</div><div class="head"><h2>Dernières dépenses</h2><button class="btn sec sm" onclick="go('expenses')">Voir tout</button></div><div class="card">${expList(3)}</div>`}
function trip(){ $('trip').innerHTML=`<div class="head"><h2>Le voyage</h2><button class="btn sm" onclick="tripEdit()">Modifier</button></div><div class="card"><h3>${E(S.trip.destination)}</h3><div class="sub">${D(S.trip.start)} → ${D(S.trip.end)}</div><div class="sub">Budget : <b>${EUR(S.trip.budget)}</b></div></div><div class="head"><h2>✈️ Vols</h2><button class="btn sm" onclick="add('flight')">+ Vol</button></div><div class="card">${S.flights.length?S.flights.map((x,i)=>`<div class="item"><div class="ico">✈️</div><div class="main"><div class="it">${E(x.airline)} ${E(x.number)}</div><div class="sub">${E(x.from)} → ${E(x.to)} · ${D(x.date)} ${E(x.time)} · T${E(x.terminal||'—')}<br>Réf. ${E(x.ref||'—')}</div></div><div class="amt">${EUR(x.price)}<br><button class="danger" onclick="del('flights',${i})">×</button></div></div>`).join(''):'<div class="empty"><b>Aucun vol</b>Ajoute tes billets.</div>'}</div><div class="head"><h2>🏨 Logements</h2><button class="btn sm" onclick="add('stay')">+ Logement</button></div><div class="card">${S.stays.length?S.stays.map((x,i)=>`<div class="item"><div class="ico">🏨</div><div class="main"><div class="it">${E(x.name)}</div><div class="sub">${D(x.start)} → ${D(x.end)}<br>${E(x.address||'')} ${E(x.phone||'')}<br>Réf. ${E(x.ref||'—')}</div></div><div class="amt">${EUR(x.price)}<br><button class="danger" onclick="del('stays',${i})">×</button></div></div>`).join(''):'<div class="empty"><b>Aucun logement</b>Ajoute hôtel, Airbnb ou autre.</div>'}</div><div class="head"><h2>👫 Partage</h2><button class="btn sec sm" onclick="syncSettings()">Configurer</button></div><div class="card">${S.trip.code?`<b>Code : <span class="accent">${E(S.trip.code)}</span></b><div class="sub">Donne ce code à Alix pour rejoindre ce voyage.</div>`:'<div class="sub">Configure Supabase pour synchroniser les deux iPhone.</div>'}</div>`}
function planning(){let a=[...S.plans].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));$('planning').innerHTML=`<div class="head"><h2>Planning</h2><button class="btn sm" onclick="add('plan')">+ Ajouter</button></div>${a.length?a.map((x,i)=>`<div class="card" style="margin-bottom:8px"><div class="item"><div class="ico">📍</div><div class="main"><div class="muted">${D(x.date)} · ${E(x.time||'')}</div><div class="it">${E(x.title)}</div><div class="sub">${E(x.place||'')} ${E(x.notes||'')}</div></div><button class="danger" onclick="del('plans',${i})">×</button></div></div>`).join(''):'<div class="empty"><b>Planning vide</b>Construisez votre voyage étape par étape.</div>'}`}
function expList(n=999){let a=[...S.expenses].sort((x,y)=>y.created.localeCompare(x.created)).slice(0,n);return a.length?a.map(x=>`<div class="item"><div class="ico">${x.category==='Restaurant'?'🍽️':x.category==='Transport'?'🚕':x.category==='Activité'?'🎟️':x.category==='Logement'?'🏨':'💳'}</div><div class="main"><div class="it">${E(x.label)}</div><div class="sub">${E(x.category)} · payé par ${E(x.payer)}</div></div><div class="amt">${EUR(x.amount)}</div></div>`).join(''):'<div class="empty"><b>Aucune dépense</b>Commencez votre suivi.</div>'}
function expenses(){let t=spent(),half=t/2,a=S.expenses.filter(x=>x.payer==='Alexis').reduce((n,x)=>n+(+x.amount||0),0),z=t-a,d=a-half;$('expenses').innerHTML=`<div class="head"><h2>Dépenses</h2><button class="btn sm" onclick="add('expense')">+ Dépense</button></div><div class="grid"><div class="card"><h3>Total</h3><div class="big">${EUR(t)}</div></div><div class="card"><h3>Reste budget</h3><div class="big ${S.trip.budget-t<0?'red':'accent'}">${EUR(S.trip.budget-t)}</div></div></div><div class="head"><h2>50 / 50</h2></div><div class="balance"><div class="person"><b>Alexis</b><strong>${EUR(a)}</strong><span class="muted">payé</span></div><div class="person"><b>Alix</b><strong>${EUR(z)}</strong><span class="muted">payé</span></div></div><div class="banner" style="margin-top:10px"><b>${Math.abs(d)<.01?'Vous êtes à égalité 🎉':d>0?'Alix doit '+EUR(d)+' à Alexis':'Alexis doit '+EUR(-d)+' à Alix'}</b><div class="muted">Partage 50/50.</div></div><div class="card" style="margin-top:10px">${expList()}</div>`}
function docs(){$('docs').innerHTML=`<div class="head"><h2>Documents</h2><button class="btn sm" onclick="add('doc')">+ Ajouter</button></div><div class="banner"><b>📁 Réservations & documents</b><div class="muted">La V2 permet déjà d'enregistrer les liens. Le stockage de fichiers est prévu dans la structure Supabase.</div></div><div class="card">${S.docs.length?S.docs.map((x,i)=>`<div class="item"><div class="ico">📄</div><div class="main"><div class="it">${E(x.name)}</div><div class="sub">${E(x.type||'Document')} ${x.url?'· '+E(x.url):''}</div></div><button class="danger" onclick="del('docs',${i})">×</button></div>`).join(''):'<div class="empty"><b>Aucun document</b>Ajoute les liens de tes réservations.</div>'}</div>`}
function tripEdit(){openM('Modifier le voyage',`<form class=form onsubmit="saveTrip(event)"><div class=field><label>Destination</label><input id=td value="${E(S.trip.destination)}"></div><div class=field><label>Début</label><input id=ts type=date value="${S.trip.start}"></div><div class=field><label>Fin</label><input id=te type=date value="${S.trip.end}"></div><div class=field><label>Budget (€)</label><input id=tb type=number step=.01 value="${S.trip.budget}"></div><button class=btn>Enregistrer</button></form>`)}function saveTrip(e){e.preventDefault();S.trip.destination=td.value;S.trip.start=ts.value;S.trip.end=te.value;S.trip.budget=+tb.value||0;save();closeM();render();toast('Voyage mis à jour')}
function add(t){let h='',title='Ajouter';if(t==='flight'){title='Ajouter un vol';h=`<form class=form onsubmit="af(event)"><div class=field><label>Compagnie</label><input id=a1 required></div><div class=field><label>Numéro</label><input id=a2></div><div class=field><label>Départ</label><input id=a3></div><div class=field><label>Arrivée</label><input id=a4></div><div class=field><label>Date</label><input id=a5 type=date></div><div class=field><label>Heure</label><input id=a6 type=time></div><div class=field><label>Terminal</label><input id=a7></div><div class=field><label>Référence</label><input id=a8></div><div class=field><label>Prix (€)</label><input id=a9 type=number step=.01></div><button class=btn>Ajouter</button></form>`}if(t==='stay'){title='Ajouter un logement';h=`<form class=form onsubmit="as(event)"><div class=field><label>Nom</label><input id=s1 required></div><div class=field><label>Arrivée</label><input id=s2 type=date></div><div class=field><label>Départ</label><input id=s3 type=date></div><div class=field><label>Adresse</label><input id=s4></div><div class=field><label>Téléphone</label><input id=s5></div><div class=field><label>Référence</label><input id=s6></div><div class=field><label>Prix (€)</label><input id=s7 type=number step=.01></div><button class=btn>Ajouter</button></form>`}if(t==='plan'){title='Ajouter au planning';h=`<form class=form onsubmit="ap(event)"><div class=field><label>Titre</label><input id=p1 required placeholder="Randonnée, restaurant…"></div><div class=field><label>Date</label><input id=p2 type=date required></div><div class=field><label>Heure</label><input id=p3 type=time></div><div class=field><label>Lieu</label><input id=p4></div><div class=field><label>Notes</label><textarea id=p5></textarea></div><button class=btn>Ajouter</button></form>`}if(t==='expense'){title='Ajouter une dépense';h=`<form class=form onsubmit="ae(event)"><div class=field><label>Description</label><input id=e1 required></div><div class=field><label>Catégorie</label><select id=e2><option>Restaurant</option><option>Transport</option><option>Activité</option><option>Logement</option><option>Courses</option><option>Autre</option></select></div><div class=field><label>Montant (€)</label><input id=e3 type=number step=.01 required></div><div class=field><label>Payé par</label><select id=e4><option>Alexis</option><option>Alix</option></select></div><button class=btn>Ajouter</button></form>`}if(t==='doc'){title='Ajouter un document';h=`<form class=form onsubmit="ad(event)"><div class=field><label>Nom</label><input id=d1 required></div><div class=field><label>Type</label><input id=d2 placeholder="Billet / réservation / assurance"></div><div class=field><label>Lien</label><input id=d3 type=url placeholder="https://…"></div><button class=btn>Enregistrer</button></form>`}openM(title,h)}
function af(e){e.preventDefault();S.flights.push({airline:a1.value,number:a2.value,from:a3.value,to:a4.value,date:a5.value,time:a6.value,terminal:a7.value,ref:a8.value,price:+a9.value||0});save();closeM();render();toast('Vol ajouté')}function as(e){e.preventDefault();S.stays.push({name:s1.value,start:s2.value,end:s3.value,address:s4.value,phone:s5.value,ref:s6.value,price:+s7.value||0});save();closeM();render();toast('Logement ajouté')}function ap(e){e.preventDefault();S.plans.push({title:p1.value,date:p2.value,time:p3.value,place:p4.value,notes:p5.value});save();closeM();render();toast('Ajouté au planning')}function ae(e){e.preventDefault();S.expenses.push({id:crypto.randomUUID(),label:e1.value,category:e2.value,amount:+e3.value||0,payer:e4.value,created:new Date().toISOString()});save();closeM();render();toast('Dépense ajoutée')}function ad(e){e.preventDefault();S.docs.push({name:d1.value,type:d2.value,url:d3.value});save();closeM();render();toast('Document enregistré')}function del(type,i){if(confirm('Supprimer ?')){S[type].splice(i,1);save();render();}}
function syncSettings(){openM('Synchronisation à deux',`<div class=banner><b>GitHub = l'application · Supabase = les données partagées</b><div class=muted style="margin-top:5px">Crée un projet Supabase, exécute <b>supabase.sql</b> fourni avec la V2, puis colle ici l'URL et la clé publishable/anon.</div></div><form class=form onsubmit="connect(event)"><div class=field><label>Project URL</label><input id=su value="${E(cfg.url)}" placeholder="https://xxxxx.supabase.co"></div><div class=field><label>Publishable key</label><textarea id=sk>${E(cfg.key)}</textarea></div><button class=btn>Tester et connecter</button></form><div class=banner style="margin-top:10px"><b>Après connexion</b><div class=muted>Alexis crée le voyage et obtient un code. Alix entre ce code sur son iPhone.</div></div><div style="display:grid;gap:8px;margin-top:10px"><button class="btn" onclick="createRemote()">Créer le voyage partagé (Alexis)</button><button class="btn sec" onclick="join()">J'ai déjà un code (Alix)</button><button class="btn sec" onclick="disconnect()">Déconnecter ce téléphone</button></div>`)}async function connect(e){e.preventDefault();cfg={url:su.value.trim(),key:sk.value.trim()};localStorage.setItem(C,JSON.stringify(cfg));try{db=window.supabase.createClient(cfg.url,cfg.key);let r=await db.auth.signInAnonymously();if(r.error)throw r.error;$('status').textContent='Connecté · Supabase';closeM();toast('Connecté');await pull();setupRealtime();render()}catch(x){toast('Erreur : '+x.message)}}async function auth(){if(!db)return false;let s=await db.auth.getSession();if(!s.data.session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error}return true}async function createRemote(){try{await auth();let r=await db.rpc('create_trip',{p_name:'Notre Voyage',p_destination:S.trip.destination,p_start:S.trip.start,p_end:S.trip.end,p_budget:+S.trip.budget,p_alexis_name:'Alexis'});if(r.error)throw r.error;S.trip.tripId=r.data[0].trip_id;S.trip.code=r.data[0].share_code;save();toast('Voyage partagé : '+S.trip.code);await pull();setupRealtime();render()}catch(x){toast(x.message)}}function join(){openM('Rejoindre le voyage',`<form class=form onsubmit="joinRemote(event)"><div class=field><label>Code</label><input id=jc required placeholder="NV-XXXXXXX"></div><button class=btn>Rejoindre</button></form>`)}async function joinRemote(e){e.preventDefault();try{if(!db){closeM();syncSettings();return}await auth();let r=await db.rpc('join_trip',{p_share_code:jc.value.trim()});if(r.error)throw r.error;S.trip.tripId=r.data[0].trip_id;S.trip.code=r.data[0].share_code;save();closeM();await pull();setupRealtime();render();toast('Voyage rejoint')}catch(x){toast(x.message)}}async function pull(){if(!db||!S.trip.tripId)return;let id=S.trip.tripId;let [t,f,st,p,x,d]=await Promise.all([db.from('trips').select('*').eq('id',id).single(),db.from('flights').select('*').eq('trip_id',id),db.from('stays').select('*').eq('trip_id',id),db.from('plans').select('*').eq('trip_id',id),db.from('expenses').select('*').eq('trip_id',id).order('created_at',{ascending:false}),db.from('documents').select('*').eq('trip_id',id)]);if(t.data)Object.assign(S.trip,{destination:t.data.destination,start:t.data.start,end:t.data.end,budget:t.data.budget});S.flights=(f.data||[]).map(x=>({id:x.id,airline:x.airline,number:x.number,from:x.from_airport,to:x.to_airport,date:x.date,time:x.time,terminal:x.terminal,ref:x.booking_ref,price:x.price}));S.stays=(st.data||[]).map(x=>({id:x.id,name:x.name,start:x.start,end:x.end,address:x.address,phone:x.phone,ref:x.booking_ref,price:x.price}));S.plans=(p.data||[]).map(x=>({id:x.id,title:x.title,date:x.date,time:x.time,place:x.place,notes:x.notes}));S.expenses=(x.data||[]).map(x=>({id:x.id,label:x.label,category:x.category,amount:x.amount,payer:x.payer,created:x.created_at}));S.docs=(d.data||[]).map(x=>({id:x.id,name:x.name,type:x.doc_type,url:x.url||''}));save();render()}function setupRealtime(){if(!db||!S.trip.tripId)return;db.channel('nv-'+S.trip.tripId).on('postgres_changes',{event:'*',schema:'public',table:'trips'},pull).on('postgres_changes',{event:'*',schema:'public',table:'flights'},pull).on('postgres_changes',{event:'*',schema:'public',table:'stays'},pull).on('postgres_changes',{event:'*',schema:'public',table:'plans'},pull).on('postgres_changes',{event:'*',schema:'public',table:'expenses'},pull).on('postgres_changes',{event:'*',schema:'public',table:'documents'},pull).subscribe()}
function disconnect(){db=null;cfg={url:"",key:""};localStorage.removeItem(C);S.trip.tripId=null;S.trip.code=null;save();closeM();$('status').textContent='Mode local · prêt';toast('Synchronisation désactivée');render()}
render();if(cfg.url&&cfg.key){try{db=window.supabase.createClient(cfg.url,cfg.key);auth().then(()=>{if(S.trip.tripId){$('status').textContent='Connecté · synchronisation active';pull();setupRealtime()}}).catch(()=>{})}catch(e){}}
</script></body></html>
