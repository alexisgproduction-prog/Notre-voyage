<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Notre Voyage"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Notre Voyage V3.3</title>
<style>
:root{--bg:#090a0c;--surface:#141619;--surface2:#1b1e22;--surface3:#20242a;--line:#2b2f35;--text:#f5f5f7;--muted:#969ba3;--alexis:#a8c7fa;--alix:#d2b8f5;--iosblue:#7aaeff;--danger:#ff8f9a;--radius:24px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(800px 300px at 50% -100px,#22222b33,transparent),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;-webkit-font-smoothing:antialiased}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:105px}.top{position:sticky;top:0;z-index:10;padding:18px 18px 12px;background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(16px)}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.toprow{display:flex;justify-content:space-between;align-items:center}.brandrow{display:flex;gap:11px;align-items:center}.brandmark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f5f5f70a;border:1px solid #ffffff12;color:#f5f5f7;font-size:18px;font-weight:800}.title{font-size:31px;font-weight:800;letter-spacing:-1.4px}.title em{font-style:normal;color:var(--iosblue)}.gear{width:43px;height:43px;border:1px solid var(--line);background:var(--surface2);border-radius:15px;color:white;font-size:19px}.screen{display:none;padding:7px 15px}.screen.on{display:block}.hero{position:relative;overflow:hidden;border-radius:30px;padding:24px;background:linear-gradient(145deg,#19191f,#0d0d11);border:1px solid var(--line);box-shadow:0 20px 50px #0008}.hero:after{content:"";position:absolute;width:180px;height:180px;right:-65px;top:-70px;border-radius:50%;background:var(--iosblue);filter:blur(65px);opacity:.08}.hero h1{position:relative;margin:0 0 6px;font-size:32px;letter-spacing:-1.3px}.hero .dates{position:relative;color:var(--muted);font-size:13px}.count{position:relative;margin:24px 0 18px}.count .num{font-size:48px;line-height:.95;font-weight:850;letter-spacing:-3px}.count .label{font-size:14px;color:var(--muted);margin-top:6px}.chips{position:relative;display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#ffffff08;padding:8px 10px;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}.card h3{font-size:13px;margin:0 0 7px}.big{font-size:23px;font-weight:800}.muted{color:var(--muted);font-size:12px}.accent{color:var(--iosblue)}.bar{height:6px;background:#292930;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--iosblue);border-radius:99px}.head{display:flex;align-items:center;justify-content:space-between;margin:22px 3px 10px}.head h2{font-size:20px;letter-spacing:-.5px;margin:0}.btn{border:0;background:var(--iosblue);color:#070907;font-weight:800;border-radius:14px;padding:10px 13px}.btn.sec{background:#202026;color:var(--text);border:1px solid var(--line)}.btn.sm{font-size:12px;padding:8px 10px}.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 15px}.item{display:flex;gap:11px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.icon{width:43px;height:43px;border-radius:15px;background:#202027;display:grid;place-items:center;font-size:20px;flex:none}.main{min-width:0;flex:1}.it{font-weight:750;font-size:14px}.sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}.amt{font-weight:800;text-align:right;white-space:nowrap}.person{display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:999px;padding:4px 7px;margin-top:5px}.person.alexis{background:#a8c7fa18;color:#a8c7fa;border:1px solid #a8c7fa38}.person.alix{background:#d2b8f518;color:#d2b8f5;border:1px solid #d2b8f538}.empty{padding:24px 8px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.nav{position:fixed;z-index:30;bottom:10px;left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 18px));display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:7px;background:#15151bf0;border:1px solid #303038;border-radius:25px;backdrop-filter:blur(22px);box-shadow:0 15px 45px #000b}.nav button{border:0;background:transparent;color:#777782;border-radius:17px;padding:7px 2px;font-size:9px}.nav button.on{background:#2b2b32;color:#fff}.nav span{display:block;font-size:18px;margin-bottom:2px}.form{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #34343d;background:#17171d;color:var(--text);border-radius:14px;padding:12px;font:inherit;outline:none}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal{position:fixed;inset:0;background:#000c;z-index:70;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(560px,100%);max-height:94vh;overflow:auto;background:#101014;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:16px 16px 32px}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheettop h2{margin:0;font-size:20px}.close{border:0;background:#29292f;color:white;border-radius:50%;width:35px;height:35px;font-size:20px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#1a1a20;border-radius:15px;padding:4px}.seg button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:12px}.seg button.on{background:#303038;color:white}.notice{padding:13px;border:1px solid var(--line);background:#17171d;border-radius:16px;margin-bottom:10px}.danger{background:#31181e;color:#ff9aa5;border:1px solid #54242d;border-radius:10px;padding:6px 8px}.map{height:360px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#15151a}.leaflet-container{background:#101317}.leaflet-tile{filter:brightness(.72) invert(.92) hue-rotate(180deg) saturate(.55) contrast(1.05)}.toast{position:fixed;z-index:90;left:50%;bottom:93px;transform:translate(-50%,15px);background:#f5f5f7;color:#111;padding:11px 15px;border-radius:14px;font-size:13px;font-weight:800;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.timeline{position:relative;padding-left:20px}.timeline:before{content:"";position:absolute;left:6px;top:7px;bottom:7px;width:1px;background:#33333a}.tl{position:relative;padding:0 0 17px 17px}.tl:before{content:"";position:absolute;left:-1px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--iosblue);box-shadow:0 0 0 5px #a8c7fa16}.tl .day{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.file{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:17px;background:#17171d}.file input{padding:8px}.balance{display:grid;grid-template-columns:1fr 1fr;gap:9px}.balance .card{padding:14px}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:7px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}.pill.active{color:var(--text);border-color:#55555f;background:#292930}.map-wrap{position:relative}.map{position:relative;height:430px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:#111418;box-shadow:0 18px 45px #0008}.leaflet-container{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.map-card{position:absolute;z-index:1000;left:10px;right:10px;bottom:10px;background:rgba(18,20,24,.94);border:1px solid #343941;border-radius:22px;padding:12px;box-shadow:0 18px 45px #000b;backdrop-filter:blur(20px);transform:translateY(calc(100% + 18px));opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}.map-card.show{transform:translateY(0);opacity:1}.map-card .grab{width:36px;height:4px;border-radius:99px;background:#626872;margin:0 auto 10px}.map-card-row{display:flex;gap:11px;align-items:center}.map-dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#a8c7fa18;color:var(--alexis);border:1px solid #a8c7fa35;font-size:18px;flex:none}.map-card h3{margin:0;font-size:16px;letter-spacing:-.2px}.map-card .meta{font-size:12px;color:var(--muted);margin-top:3px}.map-card .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.map-card .actions button{border:0;border-radius:13px;padding:10px;font:inherit;font-size:12px;font-weight:700;background:#262a30;color:var(--text)}.map-card .actions button.primary{background:var(--iosblue);color:#0a0d11}.map-card .address{margin-top:10px;padding:10px;border-radius:14px;background:#ffffff07;color:#c8ccd2;font-size:12px;line-height:1.4}.leaflet-control-zoom{border:0!important;box-shadow:0 8px 24px #0008!important}.leaflet-control-zoom a{background:#171a1f!important;color:#f5f5f7!important;border:1px solid #30343a!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#171a1f;color:#f5f5f7}.leaflet-popup-content{font-size:12px}.place-pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#a8c7fa;border:3px solid #0c0e11;box-shadow:0 5px 16px #0009;color:#0b0d10;font-size:12px;font-weight:900}.place-pin.alix{background:#d2b8f5}.place-pin.neutral{background:#e7e9ed}.map-filter{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.map-filter .chip{white-space:nowrap}.map-filter .chip.active{background:#ffffff0c;border-color:#4a4f57;color:#f5f5f7}.@media(min-width:700px){body{padding:18px}.app{border:1px solid #24242b;border-radius:32px;overflow:hidden;box-shadow:0 25px 80px #0008}}
</style></head>
<body><div class="app"><header class="top"><div class="toprow"><div><div class="brandrow"><span class="brandmark">↗</span><div><div class="eyebrow">NOTRE VOYAGE</div><div class="title">Alexis <em>×</em> Alix</div></div></div></div><button class="gear" onclick="settings()">⚙️</button></div></header>
<main><section id="home" class="screen on"></section><section id="trip" class="screen"></section><section id="map" class="screen"></section><section id="planning" class="screen"></section><section id="expenses" class="screen"></section><section id="docs" class="screen"></section></main>
<nav class="nav"><button data-tab="home" class="on"><span>⌂</span>Accueil</button><button data-tab="trip"><span>✈</span>Voyage</button><button data-tab="map"><span>⌖</span>Carte</button><button data-tab="planning"><span>◷</span>Planning</button><button data-tab="expenses"><span>€</span>Dépenses</button><button data-tab="docs"><span>▣</span>Docs</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheettop"><h2 id="mt"></h2><button class="close" onclick="closeM()">×</button></div><div id="mb"></div></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const K='nv3',C='nv3cfg';
let S=JSON.parse(localStorage.getItem(K)||'null')||{trip:{name:'Notre Voyage',destination:'Cap-Vert 🇨🇻',start:'2026-11-08',end:'2026-11-21',budget:4000,tripId:'',code:''},flights:[],stays:[],plans:[],expenses:[],docs:[],places:[],reminders:[]};
let cfg=JSON.parse(localStorage.getItem(C)||'null')||{url:'',key:''},db=null,tab='home',mapObj=null,mapMarkers=[];
const $=id=>document.getElementById(id),E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const EUR=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(+n||0);const dateFmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):'—';
const daysLeft=()=>S.trip.start?Math.ceil((new Date(S.trip.start+'T00:00:00')-new Date(new Date().toDateString()))/86400000):null;
function save(){localStorage.setItem(K,JSON.stringify(S))}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function go(x){tab=x;render();if(x==='map')setTimeout(initMap,80)}function openM(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function spent(){return S.expenses.reduce((a,x)=>a+(+x.amount||0),0)}function who(p){return `<span class="person ${p==='Alix'?'alix':'alexis'}">${p==='Alix'?'Alix':'Alexis'}</span>`}
function countdown(){let d=daysLeft();if(d===null)return ['—','avant le départ'];if(d>0)return [d,'jours avant le départ'];if(d===0)return ['Aujourd’hui','c’est le départ'];return [Math.abs(d),'jours depuis le départ']}
function render(){home();trip();mapScreen();planning();expenses();docs();document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab))}
function home(){let [num,label]=countdown(),b=+S.trip.budget||0,s=spent(),p=b?Math.min(100,s/b*100):0;let upcoming=[...S.plans,...S.reminders.map(r=>({...r,title:'🔔 '+r.title}))].filter(x=>x.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);
$('home').innerHTML=`<div class="hero"><div class="eyebrow">PROCHAIN VOYAGE</div><h1>${E(S.trip.destination)}</h1><div class="dates">${dateFmt(S.trip.start)} → ${dateFmt(S.trip.end)}</div><div class="count"><div class="num">${E(num)}</div><div class="label">${E(label)}</div></div><div class="chips"><span class="chip">👫 Alexis · Alix</span><span class="chip">💰 Budget prévu · ${EUR(b)}</span><span class="chip">${S.trip.code?'☁️ Synchronisé':'📱 Local'}</span></div></div><div class="grid"><div class="card"><h3>Budget prévu</h3><div class="big accent">${EUR(b)}</div><div class="muted" style="margin-top:7px">Montant cible du voyage · indépendant des comptes</div></div><div class="card"><h3>Dépenses réelles</h3><div class="big">${EUR(s)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="muted" style="margin-top:7px">${b?s<=b?EUR(b-s)+' sous le budget':EUR(s-b)+' au-dessus du budget':'Budget non défini'}</div></div></div><div class="head"><h2>Prochaine étape</h2><button class="btn sm" onclick="addPlan()">+ Ajouter</button></div><div class="list">${upcoming.length?upcoming.map(x=>`<div class="item"><div class="icon">${x.title?.startsWith('🔔')?'🔔':'📍'}</div><div class="main"><div class="it">${E(x.title)}</div><div class="sub">${dateFmt(x.date)} ${E(x.time||'')} · ${E(x.place||'')}</div></div></div>`).join(''):'<div class="empty"><strong>Votre voyage commence ici</strong>Ajoute un vol, un logement ou une activité.</div>'}</div><div class="head"><h2>Qui doit quoi ?</h2><button class="btn sec sm" onclick="go('expenses')">Détails</button></div><div class="balance"><div class="card">${who('Alexis')}<strong>${EUR(S.expenses.filter(x=>x.payer==='Alexis').reduce((a,x)=>a+ +x.amount,0))}</strong><div class="muted">avancé</div></div><div class="card">${who('Alix')}<strong>${EUR(S.expenses.filter(x=>x.payer==='Alix').reduce((a,x)=>a+ +x.amount,0))}</strong><div class="muted">avancé</div></div></div>`}
function trip(){let f=S.flights.map((x,i)=>`<div class="item"><div class="icon">✈️</div><div class="main"><div class="it">${E(x.airline)} ${E(x.number)}</div><div class="sub">${E(x.from)} → ${E(x.to)} · ${dateFmt(x.date)} ${E(x.time)}${x.terminal?' · T'+E(x.terminal):''}<br>Réf. ${E(x.ref||'—')} · ${who(x.paidBy||'Alexis')}</div></div><div class="amt">${EUR(x.price)}<br><button class="danger" onclick="delRemote('flights',${i})">×</button></div></div>`).join('');let st=S.stays.map((x,i)=>`<div class="item"><div class="icon">🏨</div><div class="main"><div class="it">${E(x.name)}</div><div class="sub">${dateFmt(x.start)} → ${dateFmt(x.end)}<br>${E(x.address||'Adresse non renseignée')}<br>${who(x.paidBy||'Alexis')} · ${E(x.ref||'—')}</div></div><div class="amt">${EUR(x.price)}<br><button class="danger" onclick="delRemote('stays',${i})">×</button></div></div>`).join('');$('trip').innerHTML=`<div class="head"><h2>Voyage</h2><button class="btn sm" onclick="tripEdit()">Modifier</button></div><div class="card"><div class="it">${E(S.trip.destination)}</div><div class="sub">${dateFmt(S.trip.start)} → ${dateFmt(S.trip.end)}</div></div><div class="head"><h2>✈️ Vols</h2><button class="btn sm" onclick="addFlight()">+ Vol</button></div><div class="list">${f||'<div class="empty"><strong>Aucun vol</strong>Ajoute ton premier billet.</div>'}</div><div class="head"><h2>🏨 Logements</h2><button class="btn sm" onclick="addStay()">+ Logement</button></div><div class="list">${st||'<div class="empty"><strong>Aucun logement</strong>Ajoute une réservation.</div>'}</div>`}
function mapIcon(p){let c=(p.owner==='Alix'||p.paidBy==='Alix')?'alix':'neutral';let glyph=p.category==='Hôtel'?'⌂':p.category==='Restaurant'?'●':p.category==='Plage'?'≈':p.category==='Activité'?'✦':'•';return L.divIcon({className:'',html:`<div class="place-pin ${c}">${glyph}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}
function showPlaceCard(p){let el=$('mapCard');if(!el)return;el.innerHTML=`<div class="grab"></div><div class="map-card-row"><div class="map-dot">${p.category==='Hôtel'?'⌂':p.category==='Restaurant'?'●':p.category==='Plage'?'≈':p.category==='Activité'?'✦':'•'}</div><div><h3>${E(p.name)}</h3><div class="meta">${E(p.category||'Lieu')}</div></div><button class="close" style="margin-left:auto" onclick="hidePlaceCard()">×</button></div>${p.address?`<div class="address">⌖ ${E(p.address)}</div>`:''}<div class="actions"><button class="primary" onclick="routeToPlace('${E(p.address||p.name).replace(/'/g,"\'")}')">Itinéraire</button><button onclick="addPlanFromPlace(${S.places.indexOf(p)})">Ajouter au planning</button></div>`;el.classList.add('show')}
function hidePlaceCard(){$('mapCard')?.classList.remove('show')}
function routeToPlace(q){window.open('https://maps.apple.com/?q='+encodeURIComponent(q),'_blank')}
function addPlanFromPlace(i){let p=S.places[i];if(!p)return;openM('Ajouter au planning',`<form class=form onsubmit="savePlanFromPlace(event,${i})"><div class=field><label>Activité</label><input id=pp1 value="${E(p.name)}" required></div><div class=row><div class=field><label>Date</label><input id=pp2 type=date required></div><div class=field><label>Heure</label><input id=pp3 type=time></div></div><div class=field><label>Lieu</label><input id=pp4 value="${E(p.address||p.name)}"></div><button class=btn>Ajouter</button></form>`)}
async function savePlanFromPlace(e,i){e.preventDefault();let x={title:pp1.value,date:pp2.value,time:pp3.value,place:pp4.value,notes:''};S.plans.push(x);save();closeM();render();toast('Ajouté au planning');await syncInsert('plans',x)}
function mapScreen(){$('map').innerHTML=`<div class="head"><div><div class="eyebrow">EXPLORER</div><h2>Carte</h2></div><button class="btn sm" onclick="addPlace()">+ Lieu</button></div><div class="map-filter"><span class="chip active">Tous</span><span class="chip">⌂ Hébergements</span><span class="chip">✦ Activités</span><span class="chip">● Restaurants</span><span class="chip">≈ Plages</span></div><div class="map-wrap"><div class="map" id="leafmap"></div><div id="mapCard" class="map-card"></div></div><div class="head"><h2>Lieux du voyage</h2></div><div class="list">${S.places.length?S.places.map((p,i)=>`<div class="item" onclick="selectPlace(${i})" style="cursor:pointer"><div class="icon">${p.category==='Hôtel'?'⌂':p.category==='Restaurant'?'●':p.category==='Plage'?'≈':'✦'}</div><div class="main"><div class="it">${E(p.name)}</div><div class="sub">${E(p.address||'')} · ${E(p.category||'Lieu')}</div></div><button class="danger" onclick="event.stopPropagation();delPlace(${i})">×</button></div>`).join(''):'<div class="empty"><strong>Votre carte est vide</strong>Ajoute un logement, restaurant, activité ou lieu à visiter.</div>'}</div>`}
function selectPlace(i){let p=S.places[i];if(!p)return;if(mapObj&&p.lat&&p.lng){mapObj.flyTo([p.lat,p.lng],Math.max(mapObj.getZoom(),13),{duration:.45});let m=mapMarkers[i];if(m)m.openPopup()}showPlaceCard(p)}
function initMap(){if(!document.getElementById('leafmap'))return;if(mapObj){mapObj.remove();mapObj=null}mapMarkers=[];mapObj=L.map('leafmap',{zoomControl:false,attributionControl:false}).setView([14.9,-23.5],6);L.control.zoom({position:'bottomright'}).addTo(mapObj);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(mapObj);let bounds=[];S.places.filter(p=>p.lat&&p.lng).forEach((p,idx)=>{let m=L.marker([p.lat,p.lng],{icon:mapIcon(p)}).addTo(mapObj);m.on('click',()=>{showPlaceCard(p);mapObj.flyTo([p.lat,p.lng],Math.max(mapObj.getZoom(),13),{duration:.35})});mapMarkers[idx]=m;bounds.push([p.lat,p.lng])});if(bounds.length)mapObj.fitBounds(bounds,{padding:[35,35]})}

function expenses(){let total=spent(),a=S.expenses.filter(x=>x.payer==='Alexis').reduce((s,x)=>s+ +x.amount,0),b=S.expenses.filter(x=>x.payer==='Alix').reduce((s,x)=>s+ +x.amount,0),half=total/2,owes=a-half;let balance=owes>0?`Alix doit ${EUR(owes)} à Alexis`:owes<0?`Alexis doit ${EUR(-owes)} à Alix`:'Vous êtes à égalité';$('expenses').innerHTML=`<div class="head"><div><h2>Dépenses</h2><div class="muted">On suit ce que chacun a réellement avancé, sans toucher au budget du voyage.</div></div><button class="btn sm" onclick="addExpense()">+ Dépense</button></div><div class="notice" style="margin-top:10px"><div class="eyebrow">SOLDE ENTRE VOUS</div><div class="big" style="margin-top:5px">${balance}</div><div class="muted" style="margin-top:6px">Répartition 50/50 sur les dépenses communes · total ${EUR(total)}</div></div><div class="grid" style="margin-top:10px"><div class="card">${who('Alexis')}<div class="big">${EUR(a)}</div><div class="muted">avancé</div></div><div class="card">${who('Alix')}<div class="big">${EUR(b)}</div><div class="muted">avancé</div></div></div><div class="head"><h2>Historique</h2></div><div class="list">${S.expenses.length?S.expenses.map((x,i)=>`<div class="item"><div class="icon">${x.category==='Transport'?'🚕':x.category==='Logement'?'🏨':x.category==='Restaurant'?'🍽️':x.category==='Activité'?'🎟️':'💳'}</div><div class="main"><div class="it">${E(x.label)}</div><div class="sub">${E(x.category)} · payé par ${who(x.payer)} · partagé 50/50</div></div><div class="amt">${EUR(x.amount)}<br><button class="danger" onclick="delRemote('expenses',${i})">×</button></div></div>`).join(''):'<div class="empty"><strong>Aucune dépense</strong>Ajoute une dépense pour savoir automatiquement qui doit combien à qui.</div>'}</div>`}

function addPlan(){openM('Ajouter une activité',`<form class=form onsubmit="savePlan(event)"><div class=field><label>Titre</label><input id=p1 required placeholder="Randonnée, restaurant…"></div><div class=row><div class=field><label>Date</label><input id=p2 type=date required></div><div class=field><label>Heure</label><input id=p3 type=time></div></div><div class=field><label>Lieu</label><input id=p4></div><div class=field><label>Notes</label><textarea id=p5></textarea></div><button class=btn>Ajouter</button></form>`)}async function savePlan(e){e.preventDefault();let x={title:p1.value,date:p2.value,time:p3.value,place:p4.value,notes:p5.value};S.plans.push(x);save();closeM();render();toast('Activité ajoutée');await syncInsert('plans',x)}
function addReminder(){openM('Créer un rappel',`<form class=form onsubmit="saveReminder(event)"><div class=field><label>Rappel</label><input id=r1 required placeholder="Check-in vol, check-out, activité…"></div><div class=row><div class=field><label>Date</label><input id=r2 type=date required></div><div class=field><label>Heure</label><input id=r3 type=time></div></div><div class=field><label>Type</label><select id=r4><option>Départ</option><option>Check-in</option><option>Check-out</option><option>Activité</option><option>Réservation</option><option>Autre</option></select></div><button class=btn>Créer le rappel</button></form>`)}async function saveReminder(e){e.preventDefault();let x={title:r1.value,date:r2.value,time:r3.value,type:r4.value};S.reminders.push(x);save();closeM();render();toast('Rappel créé');calendar(x)}function calendar(x){let d=x.date.replaceAll('-','');let t=(x.time||'09:00').replace(':','')+'00';let end=t;if(!x.time){t='090000';end='100000'}let ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${d}T${t}\nDTEND:${d}T${end}\nSUMMARY:${x.title.replace(/[,;\\]/g,' ')}\nEND:VEVENT\nEND:VCALENDAR`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='rappel.ics';a.click();toast('Fichier calendrier prêt')}
function addExpense(){openM('Ajouter une dépense',`<form class=form onsubmit="saveExpense(event)"><div class=field><label>Description</label><input id=e1 required></div><div class=field><label>Catégorie</label><select id=e2><option>Restaurant</option><option>Transport</option><option>Activité</option><option>Logement</option><option>Courses</option><option>Autre</option></select></div><div class=field><label>Montant (€)</label><input id=e3 type=number step=.01 required></div>${payFields('paidE')}<button class=btn>Ajouter</button></form>`)}async function saveExpense(e){e.preventDefault();let x={label:e1.value,category:e2.value,amount:+e3.value||0,payer:paidE.value,created:new Date().toISOString()};S.expenses.push(x);save();closeM();render();toast('Dépense ajoutée');await syncInsert('expenses',x)}
function addPlace(){openM('Ajouter un lieu',`<form class=form onsubmit="savePlace(event)"><div class=field><label>Nom</label><input id=l1 required placeholder="Plage, restaurant, musée…"></div><div class=field><label>Adresse</label><input id=l2 required placeholder="Adresse ou nom du lieu"></div><div class=field><label>Catégorie</label><select id=l3><option>À visiter</option><option>Restaurant</option><option>Plage</option><option>Activité</option><option>Hôtel</option><option>Autre</option></select></div><button class=btn>Ajouter sur la carte</button></form>`)}async function savePlace(e){e.preventDefault();let x={name:l1.value,address:l2.value,category:l3.value};closeM();toast('Recherche du lieu…');let q=await geocode(x.address);if(q){x.lat=q.lat;x.lng=q.lng}S.places.push(x);save();render();setTimeout(initMap,80);toast(q?'Lieu ajouté à la carte':'Lieu ajouté · position à préciser')}
async function geocode(q){try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});let a=await r.json();return a[0]?{lat:+a[0].lat,lng:+a[0].lon}:null}catch(e){return null}}async function geocodeAndPlace(x){if(!x.address||!x.name)return;let q=await geocode(x.address);if(!q){toast('Adresse du logement introuvable');return}let place={name:x.name,address:x.address,category:'Hôtel',lat:q.lat,lng:q.lng};let existing=S.places.find(p=>(p.category==='Hôtel'||p.category==='Logement')&&p.name===x.name&&p.address===x.address);if(existing){Object.assign(existing,place);if(db&&S.trip.tripId&&existing.id)await db.from('places').update({name:place.name,address:place.address,category:place.category,lat:place.lat,lng:place.lng}).eq('id',existing.id)}else{if(db&&S.trip.tripId){let r=await db.from('places').insert({trip_id:S.trip.tripId,name:place.name,address:place.address,category:place.category,lat:place.lat,lng:place.lng}).select().single();if(!r.error&&r.data)place.id=r.data.id;else if(r.error)toast('Carte : '+r.error.message)}S.places.push(place)}save();if(tab==='map'){render();setTimeout(initMap,80)}toast('📍 Logement ajouté à la carte')}
async function addDoc(){openM('Ajouter un document',`<form class=form onsubmit="saveDoc(event)"><div class=field><label>Nom</label><input id=d1 required placeholder="Billet avion, réservation…"></div><div class=field><label>Type</label><select id=d2><option>Billet</option><option>Réservation</option><option>Assurance</option><option>Location</option><option>Autre</option></select></div><div class=field><label>Fichier PDF / image</label><input id=d3 type=file accept="application/pdf,image/*" required></div><button class=btn>Ajouter</button></form>`)}
async function saveDoc(e){e.preventDefault();let file=d3.files[0],url='';if(db&&S.trip.tripId){try{let path=`${S.trip.tripId}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let up=await db.storage.from('trip-documents').upload(path,file,{upsert:false});if(up.error)throw up.error;let pub=db.storage.from('trip-documents').getPublicUrl(path);url=pub.data.publicUrl}catch(err){toast('Upload impossible : '+err.message);return}}else{url=URL.createObjectURL(file)}S.docs.push({name:d1.value,type:d2.value,url,owner:'Alexis'});save();closeM();render();toast('Document ajouté');if(db&&S.trip.tripId)await syncInsert('documents',{name:d1.value,type:d2.value,url})}
function settings(){openM('Réglages',`<div class="notice"><b>${S.trip.code?'☁️ Voyage partagé':'📱 Mode local'}</b><div class=muted style="margin-top:5px">Les données se synchronisent entre les deux iPhones quand Supabase est connecté.</div></div><form class=form onsubmit="connect(event)"><div class=field><label>Project URL</label><input id=su value="${E(cfg.url)}" placeholder="https://xxxxx.supabase.co"></div><div class=field><label>Publishable key</label><textarea id=sk>${E(cfg.key)}</textarea></div><button class=btn>Tester et connecter</button></form><div class="head"><h2>Partage</h2></div><div class="notice"><b>${S.trip.code||'Pas encore de code'}</b><div class=muted style="margin-top:5px">Alexis crée le voyage. Alix utilise ensuite ce code sur son iPhone.</div></div><div style="display:grid;gap:8px"><button class="btn" onclick="createRemote()">Créer / actualiser le voyage partagé</button><button class="btn sec" onclick="join()">J'ai déjà un code</button><button class="btn sec" onclick="disconnect()">Déconnecter ce téléphone</button></div>`)}
async function connect(e){e.preventDefault();cfg={url:su.value.trim().replace(/\/$/,''),key:sk.value.trim()};localStorage.setItem(C,JSON.stringify(cfg));try{db=window.supabase.createClient(cfg.url,cfg.key);let r=await db.auth.signInAnonymously();if(r.error)throw r.error;closeM();toast('Supabase connecté');await pull();setupRealtime();render()}catch(x){toast('Erreur : '+x.message)}}async function auth(){if(!db)throw Error('Supabase non configuré');let s=await db.auth.getSession();if(!s.data.session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error}}
async function createRemote(){try{await auth();let r=await db.rpc('create_trip',{p_name:'Notre Voyage',p_destination:S.trip.destination,p_start:S.trip.start,p_end:S.trip.end,p_budget:+S.trip.budget,p_alexis_name:'Alexis'});if(r.error)throw r.error;S.trip.tripId=r.data[0].trip_id;S.trip.code=r.data[0].share_code;save();closeM();await pull();setupRealtime();render();toast('Code : '+S.trip.code)}catch(x){toast(x.message)}}
function join(){openM('Rejoindre le voyage',`<form class=form onsubmit="joinRemote(event)"><div class=field><label>Code de partage</label><input id=jc required placeholder="NV-XXXXXXX"></div><button class=btn>Rejoindre</button></form>`)}async function joinRemote(e){e.preventDefault();try{await auth();let r=await db.rpc('join_trip',{p_share_code:jc.value.trim()});if(r.error)throw r.error;S.trip.tripId=r.data[0].trip_id;S.trip.code=r.data[0].share_code;save();closeM();await pull();setupRealtime();render();toast('Voyage rejoint')}catch(x){toast(x.message)}}
async function pull(){if(!db||!S.trip.tripId)return;let id=S.trip.tripId;let [t,f,st,p,x,d]=await Promise.all([db.from('trips').select('*').eq('id',id).single(),db.from('flights').select('*').eq('trip_id',id),db.from('stays').select('*').eq('trip_id',id),db.from('plans').select('*').eq('trip_id',id),db.from('expenses').select('*').eq('trip_id',id).order('created_at',{ascending:false}),db.from('documents').select('*').eq('trip_id',id)]);if(t.data)Object.assign(S.trip,{destination:t.data.destination,start:t.data.start,end:t.data.end,budget:t.data.budget});S.flights=(f.data||[]).map(x=>({id:x.id,airline:x.airline,number:x.number,from:x.from_airport,to:x.to_airport,date:x.date,time:x.time,terminal:x.terminal,ref:x.booking_ref,price:x.price,paidBy:x.paid_by||'Alexis',reservedBy:x.reserved_by||'Alexis'}));S.stays=(st.data||[]).map(x=>({id:x.id,name:x.name,start:x.start,end:x.end,address:x.address,phone:x.phone,ref:x.booking_ref,price:x.price,paidBy:x.paid_by||'Alexis',reservedBy:x.reserved_by||'Alexis'}));S.plans=(p.data||[]).map(x=>({id:x.id,title:x.title,date:x.date,time:x.time,place:x.place,notes:x.notes}));S.expenses=(x.data||[]).map(x=>({id:x.id,label:x.label,category:x.category,amount:x.amount,payer:x.payer,created:x.created_at}));S.docs=(d.data||[]).map(x=>({id:x.id,name:x.name,type:x.doc_type,url:x.url||'',owner:x.owner_name||'Alexis'}));try{let [pl,rm]=await Promise.all([db.from('places').select('*').eq('trip_id',id),db.from('reminders').select('*').eq('trip_id',id)]);S.places=pl.data||[];S.reminders=rm.data||[]}catch(e){}save();render();for(const stay of S.stays){if(stay.address){let exists=S.places.some(p=>(p.category==='Hôtel'||p.category==='Logement')&&p.name===stay.name&&p.address===stay.address);if(!exists)geocodeAndPlace(stay)}}} 

async function syncInsert(table,x){if(!db||!S.trip.tripId)return;let map={flights:{trip_id:S.trip.tripId,airline:x.airline,number:x.number,from_airport:x.from,to_airport:x.to,date:x.date,time:x.time,terminal:x.terminal,booking_ref:x.ref,price:x.price,paid_by:x.paidBy,reserved_by:x.reservedBy},stays:{trip_id:S.trip.tripId,name:x.name,start:x.start,end:x.end,address:x.address,phone:x.phone,booking_ref:x.ref,price:x.price,paid_by:x.paidBy,reserved_by:x.reservedBy},plans:{trip_id:S.trip.tripId,title:x.title,date:x.date,time:x.time,place:x.place,notes:x.notes},expenses:{trip_id:S.trip.tripId,label:x.label,category:x.category,amount:x.amount,payer:x.payer},documents:{trip_id:S.trip.tripId,name:x.name,doc_type:x.type,url:x.url,owner_name:x.owner||'Alexis'}};let r=await db.from(table).insert(map[table]);if(r.error)toast('Sync : '+r.error.message)}
function setupRealtime(){if(!db||!S.trip.tripId)return;db.channel('nv3-'+S.trip.tripId).on('postgres_changes',{event:'*',schema:'public',table:'trips'},pull).on('postgres_changes',{event:'*',schema:'public',table:'flights'},pull).on('postgres_changes',{event:'*',schema:'public',table:'stays'},pull).on('postgres_changes',{event:'*',schema:'public',table:'plans'},pull).on('postgres_changes',{event:'*',schema:'public',table:'expenses'},pull).on('postgres_changes',{event:'*',schema:'public',table:'documents'},pull).on('postgres_changes',{event:'*',schema:'public',table:'places'},pull).on('postgres_changes',{event:'*',schema:'public',table:'reminders'},pull).subscribe()}
async function delRemote(table,i){let arr=S[table],x=arr[i];if(!confirm('Supprimer ?'))return;if(db&&S.trip.tripId&&x.id){let r=await db.from(table).delete().eq('id',x.id);if(r.error){toast(r.error.message);return}}arr.splice(i,1);save();render()}
